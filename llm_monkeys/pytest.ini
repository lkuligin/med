[pytest]
# Three test files share a basename across directories (test_agent.py,
# test_parser.py, test_workflow.py each exist under tests/unit/ and again under
# tests/unit/inference/ or tests/unit/verifier/). With pytest's default prepend
# import mode and no __init__.py files, the second of each pair collides with
# the first and collection fails outright. importlib mode gives each file its
# own module identity, so the suite collects without renaming anything.
addopts = --import-mode=importlib
testpaths = tests
